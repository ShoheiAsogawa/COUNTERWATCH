<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COUNTERWATCH — Overwatch Anti-Pick</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">CW</div>
        <div>
          <h1>COUNTER<span>WATCH</span></h1>
          <p data-i18n-sub>スクショを貼るだけで、今すぐ勝てるヒーローが分かる</p>
        </div>
      </div>
      <div class="role-switch" role="tablist" aria-label="Your role">
        <button class="tab role-tank" data-role-btn="tank">TANK</button>
        <button class="tab role-damage is-on" data-role-btn="damage">DAMAGE</button>
        <button class="tab role-support" data-role-btn="support">SUPPORT</button>
      </div>
      <div class="side-switch">
        <button class="ghost" data-side="attack">ATK</button>
        <button class="ghost is-on" data-side="flex">FLEX</button>
        <button class="ghost" data-side="defend">DEF</button>
      </div>
      <div class="lang-switch">
        <button class="ghost is-on" data-lang="ja">JP</button>
        <button class="ghost" data-lang="en">EN</button>
      </div>
    </header>

    <div class="workspace">
      <section class="panel">
        <h2 data-i18n-map>マップ</h2>
        <input class="search" name="map-search" data-map-search placeholder="King's Row / キングス…">
        <div class="map-grid" data-map-grid></div>
        <div data-map-info></div>
      </section>

      <section class="panel">
        <h2 data-i18n-enemy>敵の編成</h2>
        <div class="enemy-slots" data-enemy-slots></div>
        <div class="row-actions">
          <button class="ghost" data-clear-enemies>CLEAR</button>
          <button class="ghost" data-swap-team>SWAP TEAM</button>
          <button class="ghost" data-demo>DEMO</button>
        </div>
        <div class="comp-banner" data-comp-banner></div>
      </section>

      <section class="panel">
        <h2 data-i18n-picks>今のアンチピック</h2>
        <div class="picks" data-picks></div>
      </section>
    </div>

    <section class="hero-dock">
      <div class="dock-head">
        <h2 data-i18n-picker>ヒーローをタップして敵編成を入力</h2>
        <button class="ghost is-on" data-picker-role="all">ALL</button>
        <button class="ghost" data-picker-role="tank">TANK</button>
        <button class="ghost" data-picker-role="damage">DPS</button>
        <button class="ghost" data-picker-role="support">SUP</button>
        <input class="search" name="hero-search" data-hero-search placeholder="/  search">
      </div>
      <div data-hero-grid></div>
    </section>

    <section class="shot-dock" data-shot-zone>
      <div class="dock-head">
        <h2 data-i18n-shot>スコアボード／スタッツ画面をここに貼る</h2>
        <span class="muted" data-i18n-shot-hint>Ctrl+V またはドロップ。TAB画面・試合終了ボード両対応</span>
      </div>
      <div class="shot-zone">
        <div class="shot-frame" data-shot-frame></div>
        <div class="shot-side">
          <label class="file-btn">UPLOAD<input data-file type="file" accept="image/*" hidden></label>
          <button class="ghost" data-sample-shot>SAMPLE</button>
          <button class="ghost" data-clear-shot>REMOVE</button>
          <p class="muted">T / D / S = ロール<br>Esc = 編成クリア</p>
        </div>
      </div>
      <p class="shot-status" data-shot-status></p>
    </section>
  </div>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/vision.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
